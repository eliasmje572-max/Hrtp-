<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mcc.v1 Mobile Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080b10;
            --panel-bg: rgba(15, 22, 34, 0.95);
            --panel-border: rgba(0, 255, 204, 0.15);
            --accent-neon: #00ffcc;
            --accent-sol: #9945FF;
            --accent-bsc: #F3BA2F;
            --accent-rh: #00C805;
            --green: #10b981;
            --red: #f43f5e;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', monospace; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); padding: 8px; min-height: 100vh; }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .brand { font-size: 15px; font-weight: 800; color: var(--accent-neon); letter-spacing: 1px; }

        .controls { display: flex; gap: 8px; align-items: center; }
        select, input {
            background: #0f172a; border: 1px solid var(--panel-border); color: #fff;
            padding: 6px; border-radius: 6px; font-size: 11px; outline: none;
        }

        /* TABS FÖR MOBIL (Smidigt att växla kedja på mobilen) */
        .tab-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active-sol { border-color: var(--accent-sol); color: var(--accent-sol); background: rgba(153, 69, 255, 0.1); }
        .tab-btn.active-bsc { border-color: var(--accent-bsc); color: var(--accent-bsc); background: rgba(243, 186, 47, 0.1); }
        .tab-btn.active-base { border-color: var(--accent-rh); color: var(--accent-rh); background: rgba(0, 200, 5, 0.1); }

        /* LAYOUT */
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 3 COLUMNS (Dator/Sida-vid-sida om skärmen är bred) */
        @media (min-width: 900px) {
            .tab-bar { display: none; }
            .main-layout { display: grid; grid-template-columns: repeat(3, 1fr) 400px; }
            .column { display: flex !important; }
        }

        .column {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            max-height: 450px;
            overflow: hidden;
        }

        .col-sol { border-top: 3px solid var(--accent-sol); }
        .col-bsc { border-top: 3px solid var(--accent-bsc); }
        .col-rh { border-top: 3px solid var(--accent-rh); }

        .column-header {
            padding: 8px 10px;
            font-size: 11px;
            font-weight: 800;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
        }

        .feed {
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 8px;
            padding: 8px;
        }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .symbol { font-size: 13px; font-weight: 800; }

        .badge { font-size: 8px; font-weight: 800; padding: 2px 4px; border-radius: 4px; }
        .badge-passed { background: rgba(16, 185, 129, 0.2); color: var(--green); border: 1px solid var(--green); }
        .badge-checking { background: rgba(244, 63, 94, 0.2); color: var(--red); border: 1px solid var(--red); }

        .stats { font-size: 9px; color: var(--text-muted); margin-bottom: 6px; display: flex; gap: 6px; }

        .actions { display: flex; gap: 4px; }
        .btn {
            background: rgba(255, 255, 255, 0.08); border: none; color: #fff;
            padding: 6px; border-radius: 4px; font-size: 10px; font-weight: 800;
            cursor: pointer; flex: 1; text-align: center;
        }
        .btn-copy { background: var(--accent-neon); color: #000; font-weight: 900; }

        /* CHART CONTAINER */
        .chart-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            height: 380px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-top: 8px;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">⚡ Mcc.v1</div>
        <div class="controls">
            <label style="font-size:9px; color:var(--text-muted)">MAX AGE:</label>
            <input type="number" id="age-input" value="15" min="2" max="30" style="width:45px;" onchange="fetchData()">
            <select id="chart-source" onchange="updateChart()">
                <option value="gmgn">GMGN</option>
                <option value="dex">DexScr</option>
            </select>
        </div>
    </div>

    <!-- TABS FÖR MOBILSKÄRM -->
    <div class="tab-bar">
        <div class="tab-btn active-sol" onclick="switchTab('sol', this)">SOLANA</div>
        <div class="tab-btn" onclick="switchTab('bsc', this)">BSC</div>
        <div class="tab-btn" onclick="switchTab('base', this)">BASE</div>
    </div>

    <div class="main-layout">
        <!-- SOLANA -->
        <div class="column col-sol" id="col-sol">
            <div class="column-header" style="color: var(--accent-sol)">SOLANA HOT <span id="cnt-sol" style="color:#fff">0</span></div>
            <div class="feed" id="feed-sol"></div>
        </div>

        <!-- BSC -->
        <div class="column col-bsc" id="col-bsc" style="display:none;">
            <div class="column-header" style="color: var(--accent-bsc)">BSC HOT <span id="cnt-bsc" style="color:#fff">0</span></div>
            <div class="feed" id="feed-bsc"></div>
        </div>

        <!-- BASE / ROBINHOOD -->
        <div class="column col-rh" id="col-base" style="display:none;">
            <div class="column-header" style="color: var(--accent-rh)">ROBINHOOD (BASE) <span id="cnt-base" style="color:#fff">0</span></div>
            <div class="feed" id="feed-base"></div>
        </div>

        <!-- LIVE CHART -->
        <div class="chart-box">
            <div style="padding: 6px 10px; background: #000; font-size: 10px; font-weight: 800; color: var(--accent-neon);" id="chart-title">
                KLICKA PÅ ETT COIN FÖR CHART
            </div>
            <iframe id="chart-iframe" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        let activeToken = null;

        function formatUSD(val) {
            val = parseFloat(val);
            if (val >= 1000000) return '$' + (val / 1000000).toFixed(1) + 'M';
            if (val >= 1000) return '$' + (val / 1000).toFixed(0) + 'K';
            return '$' + val.toFixed(1);
        }

        function copyCA(ca, btn) {
            navigator.clipboard.writeText(ca);
            const orig = btn.innerText;
            btn.innerText = "COPIED! ✅";
            setTimeout(() => btn.innerText = orig, 1200);
        }

        function selectToken(token) {
            activeToken = token;
            document.getElementById("chart-title").innerText = `$${token.symbol} (${token.chain.toUpperCase()}) — LIVE CHART`;
            updateChart();
        }

        function updateChart() {
            if (!activeToken) return;
            const src = document.getElementById("chart-source").value;
            const iframe = document.getElementById("chart-iframe");

            if (src === "gmgn") {
                iframe.src = `https://gmgn.ai/${activeToken.chain}/token/${activeToken.address}`;
            } else {
                iframe.src = `https://dexscreener.com/${activeToken.chain === 'sol' ? 'solana' : activeToken.chain}/${activeToken.address}?embed=1&theme=dark`;
            }
        }

        function switchTab(chain, btn) {
            if (window.innerWidth < 900) {
                document.getElementById('col-sol').style.display = 'none';
                document.getElementById('col-bsc').style.display = 'none';
                document.getElementById('col-base').style.display = 'none';

                document.getElementById(`col-${chain}`).style.display = 'flex';

                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.className = 'tab-btn';
                });
                btn.className = `tab-btn active-${chain}`;
            }
        }

        async function fetchChain(chain) {
            const ageMins = document.getElementById("age-input").value;
            const maxAgeSecs = ageMins * 60;
            const now = Math.floor(Date.now() / 1000);

            // Anropar GMGN API direkt utan backend
            const url = `https://gmgn.ai/defi/quotation/v1/rank/${chain}/swaps/1h?limit=30&orderby=swaps&direction=desc`;

            try {
                const res = await fetch(url);
                const json = await res.json();
                const raw = json?.data?.rank || [];
                
                const filtered = [];
                raw.forEach(t => {
                    const age = now - (t.creation_timestamp || now);
                    if (age >= 0 && age <= maxAgeSecs) {
                        const liq = floatVal = parseFloat(t.liquidity || 0);
                        const vol = floatVal = parseFloat(t.volume || 0);
                        filtered.append = filtered.push({
                            symbol: (t.symbol || "UNK").toUpperCase(),
                            address: t.address,
                            chain: chain,
                            age_mins: Math.round(age / 60 * 10) / 10,
                            hype: t.swaps || 0,
                            liquidity: liq,
                            passed: liq >= 2500 && vol >= 4000,
                            twitter: t.twitter_username || t.twitter || ""
                        });
                    }
                });

                renderFeed(filtered, chain);
            } catch (e) {
                console.log("Fetch error on chain " + chain, e);
            }
        }

        function renderFeed(tokens, chain) {
            const container = document.getElementById(`feed-${chain}`);
            document.getElementById(`cnt-${chain}`).innerText = tokens.length;
            container.innerHTML = "";

            if (tokens.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:15px; font-size:10px; color:#555;">Inga nya mynt hittades</div>';
                return;
            }

            tokens.forEach((t, i) => {
                const card = document.createElement("div");
                card.className = "card";
                card.onclick = () => selectToken(t);

                card.innerHTML = `
                    <div class="card-top">
                        <span class="symbol">#${i+1} $${t.symbol}</span>
                        <span class="badge ${t.passed ? 'badge-passed' : 'badge-checking'}">${t.passed ? 'PASSED' : 'CHECK'}</span>
                    </div>
                    <div class="stats">
                        <span>⏱ ${t.age_mins}m</span>
                        <span>🔥 ${t.hype} Swaps</span>
                        <span>Liq: ${formatUSD(t.liquidity)}</span>
                    </div>
                    <div class="actions">
                        <button class="btn btn-copy" onclick="event.stopPropagation(); copyCA('${t.address}', this)">COPY CA</button>
                        ${t.twitter ? `<a href="https://x.com/${t.twitter}" target="_blank" onclick="event.stopPropagation()" style="flex:1;"><button class="btn">X</button></a>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function fetchData() {
            fetchChain("sol");
            fetchChain("bsc");
            fetchChain("base");
        }

        fetchData();
        setInterval(fetchData, 12000);
    </script>
</body>
</html>
