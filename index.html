<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilyes.x1 Scanner</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(18, 24, 38, 0.7);
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: #f3f4f6; padding: 16px; min-height: 100vh; background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15), transparent 50%); }

        .header { text-align: center; margin-bottom: 20px; position: relative; }
        .brand-title { font-size: 26px; font-weight: 900; background: linear-gradient(135deg, #fff 30%, #a5f3fc 70%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; }
        .brand-subtitle { font-size: 11px; color: #64748b; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        
        .pulse-dot { width: 8px; height: 8px; background-color: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

        .notify-bar { background: rgba(30, 41, 59, 0.5); border: 1px solid var(--border-color); backdrop-filter: blur(10px); border-radius: 12px; padding: 12px; margin-bottom: 16px; text-align: center; font-size: 12px; color: #94a3b8; }
        .btn-notify { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-weight: 800; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-top: 8px; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; }

        .chains { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .chain-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); color: #94a3b8; padding: 8px 18px; border-radius: 20px; font-size: 11px; font-weight: 800; cursor: pointer; backdrop-filter: blur(5px); transition: all 0.2s ease; }
        .chain-btn.active { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #ffffff; border-color: #60a5fa; box-shadow: 0 0 12px rgba(37, 99, 235, 0.4); }

        .grid { display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); border-radius: 16px; padding: 16px; border: 1px solid var(--border-color); position: relative; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        
        .card.legendary { border-left: 4px solid var(--accent-gold); background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), var(--card-bg)); box-shadow: 0 0 15px rgba(245, 158, 11, 0.1); }
        .card.rare { border-left: 4px solid var(--accent-blue); background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), var(--card-bg)); }
        .card.common { border-left: 4px solid var(--accent-green); }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .ticker-group { display: flex; align-items: center; gap: 8px; }
        .ticker { font-size: 18px; font-weight: 900; color: #ffffff; letter-spacing: -0.5px; }
        .hype-badge { font-size: 11px; color: #f59e0b; font-weight: 800; background: rgba(245, 158, 11, 0.15); padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(245, 158, 11, 0.3); }

        .badge { font-size: 9px; font-weight: 900; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-legendary { background: rgba(245, 158, 11, 0.2); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-rare { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
        .badge-common { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.4); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 12px 0; background: rgba(0, 0, 0, 0.2); padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.03); }
        .stat-item span { color: #64748b; display: block; font-size: 9px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
        .stat-item strong { color: #f1f5f9; font-size: 12px; font-weight: 800; }

        .ca-box { background: rgba(0, 0, 0, 0.4); padding: 8px 10px; border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; color: #94a3b8; margin-bottom: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px dashed rgba(255, 255, 255, 0.1); }

        .actions { display: flex; gap: 8px; }
        .btn { flex: 1; text-align: center; padding: 10px 4px; border-radius: 8px; font-size: 11px; font-weight: 800; text-decoration: none; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: opacity 0.2s; }
        .btn:active { opacity: 0.8; }
        .btn-copy { background: linear-gradient(135deg, #10b981, #059669); color: #000; }
        .btn-gmgn { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; }
        .loading { text-align: center; color: #64748b; padding: 30px; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-title">Ilyes.x1 Scanner</div>
        <div class="brand-subtitle">
            <span class="pulse-dot"></span> Hot Searches Live Feed
        </div>
    </div>

    <div class="notify-bar" id="notify-box">
        🔔 Enable push notifications for Hot Search alerts
        <br>
        <button class="btn-notify" onclick="enableNotifications()">Enable Alerts</button>
    </div>

    <div class="chains">
        <button class="chain-btn active" onclick="switchChain('solana', this)">SOLANA</button>
        <button class="chain-btn" onclick="switchChain('bsc', this)">BNB</button>
        <button class="chain-btn" onclick="switchChain('ethereum', this)">ETH</button>
    </div>

    <div class="grid" id="coin-container">
        <div class="loading">Loading Hot Searches...</div>
    </div>

    <script>
        let currentChain = 'solana';
        let seenCoins = new Set();

        function enableNotifications() {
            if (!("Notification" in window)) {
                alert("Notifications are not supported on this browser.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    document.getElementById("notify-box").style.display = "none";
                    new Notification("Ilyes.x1 Scanner", { body: "Hot Search alerts activated! 🔥" });
                }
            });
        }

        function switchChain(chain, btn) {
            currentChain = chain;
            document.querySelectorAll('.chain-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchHotSearches();
        }

        function copyCA(address, btn) {
            navigator.clipboard.writeText(address).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "COPIED! ✅";
                btn.style.background = "#059669";
                btn.style.color = "#fff";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = "linear-gradient(135deg, #10b981, #059669)";
                    btn.style.color = "#000";
                }, 2000);
            });
        }

        function formatNumber(num) {
            if (!num) return "$0";
            if (num >= 1e6) return "$" + (num / 1e6).toFixed(2) + "M";
            if (num >= 1e3) return "$" + (num / 1e3).toFixed(1) + "K";
            return "$" + Math.round(num);
        }

        async function fetchHotSearches() {
            const container = document.getElementById("coin-container");
            const gmgnChain = currentChain === 'solana' ? 'sol' : (currentChain === 'ethereum' ? 'eth' : 'bsc');

            try {
                // Använd DexScreener Search endpoint som alltid returnerar aktiva och heta tokens
                const res = await fetch(`https://api.dexscreener.com/latest/dex/search?q=${currentChain}`);
                const data = await res.json();
                
                let pairs = (data.pairs || [])
                    .filter(p => p.chainId === currentChain)
                    .sort((a, b) => (b.txns?.h1?.buys || 0) - (a.txns?.h1?.buys || 0))
                    .slice(0, 25);

                container.innerHTML = "";

                if (pairs.length === 0) {
                    container.innerHTML = '<div class="loading">No tokens found. Retrying...</div>';
                    return;
                }

                pairs.forEach((p, index) => {
                    const symbol = p.baseToken?.symbol || 'TOKEN';
                    const address = p.baseToken?.address || '';
                    const volume = p.volume?.h1 || 0;
                    const liquidity = p.liquidity?.usd || 0;
                    const buys = p.txns?.h1?.buys || 0;

                    let rarity = "common";
                    if (index < 3) rarity = "legendary";
                    else if (index < 8) rarity = "rare";

                    const card = document.createElement("div");
                    card.className = `card ${rarity}`;
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="ticker-group">
                                <span class="ticker">#${index + 1} $${symbol}</span>
                                <span class="hype-badge">🔥 ${buys} buys/h</span>
                            </div>
                            <span class="badge badge-${rarity}">${rarity}</span>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-item"><span>Chain</span><strong>${currentChain.toUpperCase()}</strong></div>
                            <div class="stat-item"><span>1h Vol</span><strong>${formatNumber(volume)}</strong></div>
                            <div class="stat-item"><span>Liquidity</span><strong>${formatNumber(liquidity)}</strong></div>
                        </div>
                        <div class="ca-box">📋 ${address}</div>
                        <div class="actions">
                            <button class="btn btn-copy" onclick="copyCA('${address}', this)">Copy CA</button>
                            <a href="https://gmgn.ai/${gmgnChain}/token/${address}" target="_blank" class="btn btn-gmgn">GMGN</a>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                container.innerHTML = '<div class="loading">Kunde inte hämta data. Kontrollera internetanslutningen.</div>';
            }
        }

        if (Notification.permission === "granted") {
            document.getElementById("notify-box").style.display = "none";
        }

        fetchHotSearches();
        setInterval(fetchHotSearches, 10000);
    </script>
</body>
</html>
