<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mcc.v2 — GMGN Hot Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b10;
    --panel:#0e131c;
    --panel-2:#131a26;
    --line:rgba(255,255,255,0.07);
    --text:#e7edf5;
    --dim:#7686a0;
    --dimmer:#4a5670;
    --sol:#9945FF;
    --bsc:#F0B90B;
    --rh:#00C805;
    --ok:#1fdf9c;
    --warn:#ff9d3d;
    --danger:#ff4d6d;
    --mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:var(--mono);-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);}
  body{padding:10px;min-height:100vh;}

  /* ---------- HEADER ---------- */
  .header{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px 14px;background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:12px;margin-bottom:10px;
  }
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .brand-name{font-size:14px;font-weight:800;letter-spacing:.4px;}
  .brand-sub{font-size:9px;color:var(--dim);font-weight:500;}

  .controls{display:flex;align-items:center;gap:10px;}
  .field{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .field label{font-size:8px;color:var(--dimmer);font-weight:700;}
  .field input{
    width:48px;background:var(--bg);border:1px solid var(--line);color:var(--text);
    padding:5px 6px;border-radius:6px;font-size:11px;outline:none;text-align:center;
  }
  .field input:focus{border-color:var(--sol);}

  .notif-toggle{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;user-select:none;}
  .notif-toggle span{font-size:8px;color:var(--dimmer);font-weight:700;}
  .switch{width:34px;height:19px;border-radius:20px;background:var(--bg);border:1px solid var(--line);position:relative;transition:.2s;}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--dim);transition:.2s;}
  .switch.on{background:rgba(31,223,156,0.15);border-color:var(--ok);}
  .switch.on::after{left:17px;background:var(--ok);box-shadow:0 0 6px var(--ok);}

  /* ---------- TABS (mobile) ---------- */
  .tab-bar{display:flex;gap:6px;margin-bottom:10px;}
  .tab-btn{
    flex:1;padding:9px;background:var(--panel);border:1px solid var(--line);
    color:var(--dim);font-size:11px;font-weight:800;border-radius:8px;cursor:pointer;text-align:center;
    transition:.15s;
  }
  .tab-btn.active-sol{border-color:var(--sol);color:var(--sol);background:rgba(153,69,255,.08);}
  .tab-btn.active-bsc{border-color:var(--bsc);color:var(--bsc);background:rgba(240,185,11,.08);}
  .tab-btn.active-base{border-color:var(--rh);color:var(--rh);background:rgba(0,200,5,.08);}

  /* ---------- LAYOUT ---------- */
  .main-layout{display:flex;flex-direction:column;gap:10px;}
  @media (min-width:900px){
    .tab-bar{display:none;}
    .main-layout{display:grid;grid-template-columns:repeat(3,1fr) 420px;align-items:start;}
    .column{display:flex !important;}
  }

  .column{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    display:flex;flex-direction:column;max-height:460px;overflow:hidden;
  }
  .col-sol{border-top:2px solid var(--sol);}
  .col-bsc{border-top:2px solid var(--bsc);}
  .col-rh{border-top:2px solid var(--rh);}

  .column-header{
    padding:10px 12px;font-size:11px;font-weight:800;letter-spacing:.3px;
    border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  }
  .col-count{background:var(--bg);padding:2px 7px;border-radius:20px;font-size:10px;color:var(--text);}

  .feed{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;}
  .feed::-webkit-scrollbar{width:4px;}
  .feed::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .empty{text-align:center;padding:22px 10px;font-size:10px;color:var(--dimmer);line-height:1.5;}

  .card{
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px;
    cursor:pointer;transition:border-color .15s,transform .15s;animation:enter .25s ease;
  }
  .card:hover{border-color:rgba(255,255,255,0.18);}
  .card.selected{border-color:var(--text);}
  @keyframes enter{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

  .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .symbol{font-size:13px;font-weight:800;}
  .rank{color:var(--dimmer);font-weight:500;margin-right:3px;}

  .badge{font-size:8px;font-weight:800;padding:3px 6px;border-radius:5px;letter-spacing:.3px;}
  .badge-ok{background:rgba(31,223,156,.14);color:var(--ok);border:1px solid rgba(31,223,156,.4);}
  .badge-warn{background:rgba(255,157,61,.14);color:var(--warn);border:1px solid rgba(255,157,61,.4);}

  .stats{font-size:9.5px;color:var(--dim);margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap;}
  .stats b{color:var(--text);font-weight:700;}

  .actions{display:flex;gap:5px;}
  .btn{
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);
    padding:6px;border-radius:6px;font-size:9.5px;font-weight:800;cursor:pointer;flex:1;text-align:center;
    transition:.15s;
  }
  .btn:hover{background:rgba(255,255,255,.12);}
  .btn-copy{background:var(--ok);color:#04140e;border-color:var(--ok);}
  .btn-copy:hover{filter:brightness(1.08);}

  /* ---------- CHART ---------- */
  .chart-box{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    height:400px;display:flex;flex-direction:column;overflow:hidden;
  }
  .chart-title{
    padding:10px 12px;background:var(--bg);font-size:10px;font-weight:800;letter-spacing:.3px;
    color:var(--dim);border-bottom:1px solid var(--line);
  }
  .chart-title.live{color:var(--text);}
  iframe{width:100%;height:100%;border:none;}

  /* ---------- TOAST ---------- */
  #toast-stack{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;width:min(340px,92vw);}
  .toast{
    background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--ok);
    border-radius:8px;padding:9px 11px;font-size:11px;animation:toast-in .25s ease, toast-out .3s ease 3.2s forwards;
  }
  .toast b{font-weight:800;}
  @keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toast-out{to{opacity:0;transform:translateY(-8px);}}
</style>
</head>
<body>

  <div id="toast-stack"></div>

  <div class="header">
    <div class="brand">
      <div class="brand-dot"></div>
      <div>
        <div class="brand-name">Mcc.v2</div>
        <div class="brand-sub">GMGN HOT TERMINAL</div>
      </div>
    </div>
    <div class="controls">
      <div class="field">
        <label>MAX AGE (m)</label>
        <input type="number" id="age-input" value="15" min="2" max="30" onchange="fetchData()">
      </div>
      <div class="notif-toggle" onclick="toggleNotifications()">
        <span>ALERTS</span>
        <div class="switch" id="notif-switch"></div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-btn active-sol" onclick="switchTab('sol', this)">SOL</div>
    <div class="tab-btn" onclick="switchTab('bsc', this)">BSC</div>
    <div class="tab-btn" onclick="switchTab('base', this)">ROBINHOOD</div>
  </div>

  <div class="main-layout">
    <div class="column col-sol" id="col-sol">
      <div class="column-header" style="color:var(--sol)">SOLANA <span class="col-count" id="cnt-sol">0</span></div>
      <div class="feed" id="feed-sol"></div>
    </div>

    <div class="column col-bsc" id="col-bsc" style="display:none;">
      <div class="column-header" style="color:var(--bsc)">BSC <span class="col-count" id="cnt-bsc">0</span></div>
      <div class="feed" id="feed-bsc"></div>
    </div>

    <div class="column col-rh" id="col-base" style="display:none;">
      <div class="column-header" style="color:var(--rh)">ROBINHOOD (BASE) <span class="col-count" id="cnt-base">0</span></div>
      <div class="feed" id="feed-base"></div>
    </div>

    <div class="chart-box">
      <div class="chart-title" id="chart-title">SELECT A COIN TO VIEW ITS CHART</div>
      <iframe id="chart-iframe" src="about:blank"></iframe>
    </div>
  </div>

<script>
  const CHAIN_LABEL = { sol: 'SOL', bsc: 'BSC', base: 'Robinhood' };
  let activeToken = null;
  let notifsEnabled = false;
  let firstLoad = { sol:true, bsc:true, base:true };
  let seen = { sol:new Set(), bsc:new Set(), base:new Set() };

  try{
    notifsEnabled = localStorage.getItem('mcc_notifs') === '1' && Notification.permission === 'granted';
  }catch(e){}
  document.getElementById('notif-switch').classList.toggle('on', notifsEnabled);

  function toggleNotifications(){
    if(!('Notification' in window)){
      showToast('Notifications unsupported', 'This browser cannot show alerts.');
      return;
    }
    if(notifsEnabled){
      notifsEnabled = false;
      try{ localStorage.setItem('mcc_notifs','0'); }catch(e){}
      document.getElementById('notif-switch').classList.remove('on');
      return;
    }
    Notification.requestPermission().then(perm=>{
      if(perm === 'granted'){
        notifsEnabled = true;
        try{ localStorage.setItem('mcc_notifs','1'); }catch(e){}
        document.getElementById('notif-switch').classList.add('on');
        showToast('Alerts on', 'You will be notified when a new coin appears.');
      }else{
        showToast('Alerts blocked', 'Enable notifications in your browser settings.');
      }
    });
  }

  function showToast(title, body){
    const stack = document.getElementById('toast-stack');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<b>${title}</b><br>${body}`;
    stack.appendChild(el);
    setTimeout(()=> el.remove(), 3600);
  }

  function notifyNewCoin(chain, t){
    const label = CHAIN_LABEL[chain];
    const title = `${label}: $${t.symbol}`;
    const body = `Liq ${formatUSD(t.liquidity)} · ${t.hype} swaps · ${t.age_mins}m old`;
    showToast(title, body);
    if(notifsEnabled && Notification.permission === 'granted'){
      new Notification(title, { body });
    }
  }

  function formatUSD(val){
    val = parseFloat(val) || 0;
    if(val >= 1000000) return '$' + (val/1000000).toFixed(1) + 'M';
    if(val >= 1000) return '$' + (val/1000).toFixed(0) + 'K';
    return '$' + val.toFixed(1);
  }

  function copyCA(ca, btn){
    navigator.clipboard.writeText(ca);
    const orig = btn.innerText;
    btn.innerText = 'COPIED';
    setTimeout(()=> btn.innerText = orig, 1200);
  }

  function selectToken(token, cardEl){
    activeToken = token;
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
    if(cardEl) cardEl.classList.add('selected');
    const title = document.getElementById('chart-title');
    title.innerText = `$${token.symbol} · ${CHAIN_LABEL[token.chain]} · LIVE CHART`;
    title.classList.add('live');
    updateChart();
  }

  function updateChart(){
    if(!activeToken) return;
    document.getElementById('chart-iframe').src = `https://gmgn.ai/${activeToken.chain}/token/${activeToken.address}`;
  }

  function switchTab(chain, btn){
    if(window.innerWidth < 900){
      ['sol','bsc','base'].forEach(c=> document.getElementById(`col-${c}`).style.display = 'none');
      document.getElementById(`col-${chain}`).style.display = 'flex';
      document.querySelectorAll('.tab-btn').forEach(b=> b.className = 'tab-btn');
      btn.className = `tab-btn active-${chain}`;
    }
  }

  async function fetchChain(chain){
    const ageMins = document.getElementById('age-input').value;
    const maxAgeSecs = ageMins * 60;
    const now = Math.floor(Date.now() / 1000);
    const url = `https://gmgn.ai/defi/quotation/v1/rank/${chain}/swaps/1h?limit=30&orderby=swaps&direction=desc`;

    try{
      const res = await fetch(url);
      const json = await res.json();
      const raw = json?.data?.rank || [];

      const filtered = [];
      raw.forEach(t=>{
        const age = now - (t.creation_timestamp || now);
        if(age >= 0 && age <= maxAgeSecs){
          const liq = parseFloat(t.liquidity || 0);
          const vol = parseFloat(t.volume || 0);
          filtered.push({
            symbol: (t.symbol || 'UNK').toUpperCase(),
            address: t.address,
            chain: chain,
            age_mins: Math.round(age / 60 * 10) / 10,
            hype: t.swaps || 0,
            liquidity: liq,
            passed: liq >= 2500 && vol >= 4000,
            twitter: t.twitter_username || t.twitter || ''
          });
        }
      });

      if(!firstLoad[chain]){
        filtered.forEach(t=>{
          if(!seen[chain].has(t.address)) notifyNewCoin(chain, t);
        });
      }
      filtered.forEach(t=> seen[chain].add(t.address));
      firstLoad[chain] = false;

      renderFeed(filtered, chain);
    }catch(e){
      console.log('Fetch error on chain ' + chain, e);
    }
  }

  function renderFeed(tokens, chain){
    const container = document.getElementById(`feed-${chain}`);
    document.getElementById(`cnt-${chain}`).innerText = tokens.length;
    container.innerHTML = '';

    if(tokens.length === 0){
      container.innerHTML = '<div class="empty">No coins in range yet.<br>Widen the max age or wait for the next scan.</div>';
      return;
    }

    tokens.forEach((t,i)=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => selectToken(t, card);
      card.innerHTML = `
        <div class="card-top">
          <span class="symbol"><span class="rank">#${i+1}</span>$${t.symbol}</span>
          <span class="badge ${t.passed ? 'badge-ok' : 'badge-warn'}">${t.passed ? 'VERIFIED' : 'LOW LIQ'}</span>
        </div>
        <div class="stats">
          <span>${t.age_mins}m old</span>
          <span><b>${t.hype}</b> swaps</span>
          <span>Liq <b>${formatUSD(t.liquidity)}</b></span>
        </div>
        <div class="actions">
          <button class="btn btn-copy" onclick="event.stopPropagation(); copyCA('${t.address}', this)">COPY CA</button>
          <button class="btn" onclick="event.stopPropagation(); window.open('https://gmgn.ai/${t.chain}/token/${t.address}','_blank')">GMGN</button>
          ${t.twitter ? `<button class="btn" onclick="event.stopPropagation(); window.open('https://x.com/${t.twitter}','_blank')">X</button>` : ''}
        </div>
      `;
      container.appendChild(card);
    });
  }

  function fetchData(){
    fetchChain('sol');
    fetchChain('bsc');
    fetchChain('base');
  }

  fetchData();
  setInterval(fetchData, 12000);
</script>
</body>
</html>
